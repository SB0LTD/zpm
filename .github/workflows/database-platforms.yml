name: Database platforms

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      large_columns:
        description: 'Also validate 100M actual packed values (about 1.2 GB memory)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: database-platforms-${{ github.ref }}
  cancel-in-progress: false

env:
  SIG_RELEASE_TAG: sig-0.6.4-zig0.17.0.90a898d

jobs:
  parameter-oracle:
    name: Native parameter grammar (PostgreSQL ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 16
            image: postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
          - major: 18
            image: postgres@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify PREPARE grammar and native result/type expectations
        run: >-
          python tools/verify_pg_parameter_lexing.py
          --port ${{ job.services.postgres.ports[5432] }}
          --expected-major ${{ matrix.major }} --report parameter-oracle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parameter-oracle-pg${{ matrix.major }}
          path: parameter-oracle.json
          if-no-files-found: error

  native:
    name: Database contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: sig-0.6.4-zig0.17.0.90a898d-x86_64-linux.tar.xz
            sha256: 8dd32622531b5f81dbb12502c78e187141dd42ea3553f4d9e2c09c3e82d64a89
          - os: macos-latest
            asset: sig-0.6.4-zig0.17.0.90a898d-aarch64-macos.tar.xz
            sha256: 75ae868e63b6a90ffd3e282f410b18e5098ea87d02cbdc0fd95224f5e922491f
          - os: windows-latest
            asset: sig-0.6.4-zig0.17.0.90a898d-x86_64-windows.zip
            sha256: 49fc99ac20af7841a5b686c68a8720515deda9c28dcad0cb9191fa0de30e33a0
    defaults:
      run:
        shell: pwsh
    env:
      SIG_RELEASE_ASSET: ${{ matrix.asset }}
      SIG_RELEASE_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checksum-verified matched Sig compiler and library
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:SIG_RELEASE_ASSET
          $destination = Join-Path $env:RUNNER_TEMP 'sig-database-toolchain'
          $url = "https://github.com/SB0LTD/sig/releases/download/$env:SIG_RELEASE_TAG/$env:SIG_RELEASE_ASSET"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:SIG_RELEASE_SHA256) { throw "Sig checksum mismatch: $actual" }
          New-Item -ItemType Directory -Path $destination | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
            $binaryName = 'sig.exe'
          } else {
            tar -xf $archive -C $destination
            if ($LASTEXITCODE -ne 0) { throw 'Sig extraction failed' }
            $binaryName = 'sig'
          }
          $compiler = Get-ChildItem -LiteralPath $destination -File -Recurse |
            Where-Object Name -eq $binaryName | Select-Object -First 1
          $library = Get-ChildItem -LiteralPath $destination -Directory -Recurse |
            Where-Object { $_.Name -eq 'lib' -and (Test-Path (Join-Path $_.FullName 'std/std.sig')) } |
            Select-Object -First 1
          if ($null -eq $compiler -or $null -eq $library) {
            throw 'Sig release must contain both compiler and matched standard library'
          }
          "SIG=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIG_LIB_DIR=$($library.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $compiler.FullName version
          if ($LASTEXITCODE -ne 0) { throw 'Sig compiler did not start' }

      - name: Validate SQL oracle evidence and differential harness
        run: |
          python -m unittest discover -s tests/sql_conformance -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'SQL oracle evidence failed' }

      - name: Execute allocator-free SQL, wire, transaction and OS contracts
        run: |
          $arguments = @('build', 'test-db', 'test-sql', 'test-workers', 'test-resource-budget', 'test-packed-integer', 'test-machine-resources', 'test-parallel-read', '-Doptimize=ReleaseSafe', '-j2', '--Sig-lib-dir', $env:SIG_LIB_DIR)
          if ($env:RUNNER_OS -eq 'macOS') { $arguments += '-Dlink-libc=true' }
          & $env:SIG @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute Linux native worker and memory-grant concurrency contracts
        if: runner.os == 'Linux'
        run: |
          & $env:SIG build test-workers test-resource-budget test-machine-resources test-parallel-read -Doptimize=ReleaseSafe -Dlink-libc=false -j2 --Sig-lib-dir $env:SIG_LIB_DIR *> linux-native-concurrency.log
          $result = $LASTEXITCODE
          Get-Content linux-native-concurrency.log
          if ($result -ne 0) { exit $result }
          if (-not (Select-String -LiteralPath linux-native-concurrency.log -SimpleMatch 'native concurrent grants=80000' -Quiet)) {
            throw 'Linux native grant concurrency must execute, not skip'
          }

      - name: Qualify 100M physical column values
        if: github.event_name == 'workflow_dispatch' && inputs.large_columns
        run: |
          $arguments = @('build', 'test-packed-integer-100m', '-Doptimize=ReleaseSafe', '-j2', '--Sig-lib-dir', $env:SIG_LIB_DIR)
          if ($env:RUNNER_OS -eq 'macOS') { $arguments += '-Dlink-libc=true' }
          & $env:SIG @arguments *> packed-integer-100m.log
          $result = $LASTEXITCODE
          Get-Content packed-integer-100m.log
          exit $result

      - name: Preserve large-column qualification log
        if: always() && github.event_name == 'workflow_dispatch' && inputs.large_columns
        uses: actions/upload-artifact@v4
        with:
          name: packed-integer-100m-${{ matrix.os }}
          path: packed-integer-100m.log
          if-no-files-found: error

      - name: Validate official package catalog and layer contracts
        working-directory: cli
        run: |
          $arguments = @('build', 'test-official-packages', '-Doptimize=ReleaseSafe', '-j2', '--Sig-lib-dir', $env:SIG_LIB_DIR)
          if ($env:RUNNER_OS -eq 'macOS') { $arguments += '-Dlink-libc=true' }
          & $env:SIG @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The separate legacy CLI transport shim still implements Linux syscalls
      # on non-Windows hosts; the database backends above are Darwin-native.
      - name: Test and build the supported CLI transports
        if: runner.os != 'macOS'
        working-directory: cli
        run: |
          & $env:SIG build test -Doptimize=ReleaseSafe -j2 --Sig-lib-dir $env:SIG_LIB_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:SIG build zpm -Doptimize=ReleaseSafe -j2 --Sig-lib-dir $env:SIG_LIB_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = if ($env:RUNNER_OS -eq 'Windows') { './sig-out/bin/zpm.exe' } else { './sig-out/bin/zpm' }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify real CLI argument forwarding and child failure
        if: runner.os != 'macOS'
        run: |
          $binary = if ($env:RUNNER_OS -eq 'Windows') { 'cli/sig-out/bin/zpm.exe' } else { 'cli/sig-out/bin/zpm' }
          python tests/test_cli_forwarding.py --sig $env:SIG --zpm $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
