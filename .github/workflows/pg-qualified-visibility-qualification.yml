name: Qualified PostgreSQL catalog qualification

on:
  push:
    branches: [ci/pg-qualified-visibility-20261118]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified Sig 0.6.5
        shell: bash
        run: |
          tag=sig-0.6.5-zig0.17.0.3c72687
          asset="$tag-x86_64-linux.tar.xz"
          curl -fsSL --retry 3 "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" -o "$RUNNER_TEMP/$asset"
          echo "179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a  $RUNNER_TEMP/$asset" | sha256sum -c
          mkdir "$RUNNER_TEMP/sdk"
          tar -xf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sdk"
          compiler=$(find "$RUNNER_TEMP/sdk" -type f -name sig | head -n 1)
          standard=$(find "$RUNNER_TEMP/sdk" -type f -path '*/lib/std/std.sig' | head -n 1)
          test -x "$compiler"
          test -f "$standard"
          printf 'SIG=%s\nSIG_LIB_DIR=%s\n' "$compiler" "${standard%/std/std.sig}" >> "$GITHUB_ENV"
      - name: Run transaction, routine and visibility contracts
        shell: bash
        run: |
          mkdir evidence
          "$SIG" version | tee evidence/sig-version.log
          "$SIG" build run-contract-sql-tx-session run-contract-sql-routines run-contract-pg-table-visibility \
            --Sig-lib-dir "$SIG_LIB_DIR" -Doptimize=ReleaseSafe -j1 2>&1 | tee evidence/contracts.log
      - name: Exercise the qualified visibility function end to end
        shell: bash
        run: |
          sed 's/pg_table_is_visible(/pg_catalog.pg_table_is_visible(/g' tests/test_pg_table_visibility.sig \
            >"$RUNNER_TEMP/test_pg_qualified_visibility.sig"
          "$SIG" build-exe --Sig-lib-dir "$SIG_LIB_DIR" -OReleaseSafe --stack 16777216 \
            -femit-bin="$RUNNER_TEMP/qualified-visibility" --dep sql \
            "-Mroot=$RUNNER_TEMP/test_pg_qualified_visibility.sig" -Msql=src/core/sql.sig \
            2>&1 | tee evidence/build-qualified.log
          "$RUNNER_TEMP/qualified-visibility" 2>&1 | tee evidence/qualified.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualified-postgres-catalog-contracts
          path: evidence/
