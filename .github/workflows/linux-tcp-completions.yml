name: Linux TCP completion contract

on:
  push:
    branches: [perf/linux-tcp-completions-20261118]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install checksum-verified Sig 0.6.5
        shell: bash
        run: |
          tag=sig-0.6.5-zig0.17.0.3c72687
          asset="$tag-x86_64-linux.tar.xz"
          curl -fsSL --retry 3 "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" -o "$RUNNER_TEMP/$asset"
          echo "179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a  $RUNNER_TEMP/$asset" | sha256sum -c
          mkdir "$RUNNER_TEMP/sdk"
          tar -xf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sdk"
          compiler=$(find "$RUNNER_TEMP/sdk" -type f -name sig | head -n 1)
          standard=$(find "$RUNNER_TEMP/sdk" -type f -path '*/lib/std/std.sig' | head -n 1)
          test -x "$compiler"
          test -f "$standard"
          printf 'SIG=%s\nSIG_LIB_DIR=%s\n' "$compiler" "${standard%/std/std.sig}" >> "$GITHUB_ENV"
      - name: Execute native TCP completions with bounded buffers
        shell: bash
        run: |
          mkdir evidence
          uname -a | tee evidence/kernel.log
          cat /proc/sys/kernel/io_uring_disabled | tee evidence/io-uring-policy.log
          "$SIG" build-exe --Sig-lib-dir "$SIG_LIB_DIR" -OReleaseSafe --stack 16777216 \
            "-femit-bin=$RUNNER_TEMP/tcp-completion" --dep tcp_completion --dep tcp_server \
            -Mroot=tests/test_tcp_completion.sig -Mtcp_completion=src/platform/tcp_completion.sig \
            -Mtcp_server=src/platform/tcp_server.sig 2>&1 | tee evidence/build.log
          timeout 25 "$RUNNER_TEMP/tcp-completion" 2>&1 | tee evidence/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-tcp-completion-contract
          path: evidence/
