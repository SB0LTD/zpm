name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SIG_RELEASE_TAG: sig-0.2.0-zig0.17.0.3384d7a
  SIG_RELEASE_ASSET: sig-0.2.0-zig0.17.0.3384d7a-x86_64-linux.tar.xz
  SIG_RELEASE_SHA256: aed3d098ba7eefc6aa053d1a05730a2ccc34e04b3156a7c9f54dadf9d340556d
  # The compiler and standard library remain the tested atomic release pair.
  # Only the bounded build runner is overlaid from this reviewed revision.
  SIG_SOURCE_REF: e7cae806dceed3473c63029b83aff1a89f7478dc

jobs:
  native-sig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean

      - uses: actions/checkout@v4

      - name: Install canonical Sig toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_URL=$(gh release view "$SIG_RELEASE_TAG" \
            --repo "${{ github.repository_owner }}/sig" \
            --json assets \
            --jq ".assets[] | select(.name == \"$SIG_RELEASE_ASSET\") | .url")
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" -o "/tmp/$SIG_RELEASE_ASSET"
          echo "$SIG_RELEASE_SHA256  /tmp/$SIG_RELEASE_ASSET" | sha256sum -c -
          mkdir -p /tmp/sig
          tar -xf "/tmp/$SIG_RELEASE_ASSET" -C /tmp/sig
          SIG_BIN=$(find /tmp/sig -type f -name sig -perm -u+x | head -1)
          test -n "$SIG_BIN"
          SIG_PREFIX=$(dirname "$(dirname "$SIG_BIN")")

          # Preserve the release's compiler/lib epoch and overlay only the
          # immutable native build runner. Mixing current std/compiler_rt with
          # an older compiler is invalid even when both report Zig 0.17.
          git init -q /tmp/sig-repo
          git -C /tmp/sig-repo remote add origin \
            "https://github.com/${{ github.repository_owner }}/sig.git"
          git -C /tmp/sig-repo fetch -q --depth 1 origin "$SIG_SOURCE_REF"
          git -C /tmp/sig-repo checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/sig-repo rev-parse HEAD)" = "$SIG_SOURCE_REF"
          test -f "$SIG_PREFIX/lib/std/std.zig"
          mkdir -p "$SIG_PREFIX/tools"
          cp -a /tmp/sig-repo/tools/sig_build "$SIG_PREFIX/tools/"

          echo "SIG=$SIG_BIN" >> "$GITHUB_ENV"
          echo "SIG_LIB=$SIG_PREFIX/lib" >> "$GITHUB_ENV"
          "$SIG_BIN" version

      - name: Test ZPM library and transport graph with Sig
        run: |
          "$SIG" build test \
            --zig-lib-dir "$SIG_LIB" \
            --cache-dir /tmp/zpm-root-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going
          "$SIG" build test-integration test-server-initial \
            --zig-lib-dir "$SIG_LIB" \
            --cache-dir /tmp/zpm-network-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going

      - name: Check generated SB0 contract fixture
        run: |
          python3 tools/generate_sb0_contract.py --check \
            tools/testdata/sample_contract.json \
            tools/testdata/sample_contract.sig

      - name: Test and build the ZPM CLI with Sig
        working-directory: cli
        run: |
          "$SIG" build test \
            --zig-lib-dir "$SIG_LIB" \
            --cache-dir /tmp/zpm-cli-test-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going
          "$SIG" build zpm \
            --zig-lib-dir "$SIG_LIB" \
            --cache-dir /tmp/zpm-cli-build-cache \
            --global-cache-dir /tmp/zpm-global-cache
          file sig-out/bin/zpm
          sig-out/bin/zpm --version
