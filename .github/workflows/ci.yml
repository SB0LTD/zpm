name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-sig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean

      - uses: actions/checkout@v4

      - name: Install canonical Sig toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository_owner }}/sig"
          TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          ASSET=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '[.assets[].name | select(test("^sig-[0-9].*-x86_64-linux[.]tar[.]xz$"))] | if length == 1 then .[0] else error("expected one versioned Linux asset") end')
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --pattern SHA256SUMS.txt --dir /tmp
          (cd /tmp && grep -F "  $ASSET" SHA256SUMS.txt | sha256sum -c -)
          echo "Using latest Sig release $TAG ($ASSET)"
          mkdir -p /tmp/sig
          tar -xf "/tmp/$ASSET" -C /tmp/sig
          SIG_BIN=$(find /tmp/sig -type f -name sig -perm -u+x | head -1)
          test -n "$SIG_BIN"
          SIG_PREFIX=$(dirname "$(dirname "$SIG_BIN")")

          # Use the complete matched release; it includes the process URL fix.
          test -f "$SIG_PREFIX/lib/std/std.sig"
          echo "SIG=$SIG_BIN" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$SIG_PREFIX/lib" >> "$GITHUB_ENV"
          "$SIG_BIN" version

      - name: Test ZPM library and transport graph with Sig
        run: |
          "$SIG" build test \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-root-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going
          "$SIG" build test-integration test-server-initial \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-network-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going

      - name: Check generated SB0 contract fixture
        run: |
          python3 tools/generate_sb0_contract.py --check \
            tools/testdata/sample_contract.json \
            tools/testdata/sample_contract.sig

      - name: Test and build the ZPM CLI with Sig
        working-directory: cli
        run: |
          "$SIG" build test \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-cli-test-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going
          "$SIG" build zpm \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-cli-build-cache \
            --global-cache-dir /tmp/zpm-global-cache
          file sig-out/bin/zpm
          sig-out/bin/zpm --version

      - name: Verify real CLI argument forwarding and child failure
        run: |
          python3 tests/test_cli_forwarding.py --sig "$SIG" --zpm cli/sig-out/bin/zpm
