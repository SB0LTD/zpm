name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SIG_RELEASE_TAG: bootstrap-sig-v72
  SIG_RELEASE_ASSET: bootstrap-sig-x86_64-linux.tar.zst
  SIG_RELEASE_SHA256: 8972e90749c3e257a8bf9f6ecd7f651fd4f8d576db776d4fd5bf7de15bd18705
  SIG_RUNTIME_REF: bc2fa64b4be94996feedc9b780eb1469c395da7d

jobs:
  native-sig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go
          sudo apt-get clean

      - uses: actions/checkout@v4

      - name: Install canonical Sig toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_URL=$(gh release view "$SIG_RELEASE_TAG" \
            --repo "${{ github.repository_owner }}/sig" \
            --json assets \
            --jq ".assets[] | select(.name == \"$SIG_RELEASE_ASSET\") | .url")
          test -n "$ASSET_URL"
          curl -fsSL "$ASSET_URL" -o "/tmp/$SIG_RELEASE_ASSET"
          echo "$SIG_RELEASE_SHA256  /tmp/$SIG_RELEASE_ASSET" | sha256sum -c -
          mkdir -p /tmp/sig
          tar -xf "/tmp/$SIG_RELEASE_ASSET" -C /tmp/sig
          SIG_BIN=$(find /tmp/sig -type f -name sig -perm -u+x | head -1)
          test -n "$SIG_BIN"
          SIG_PREFIX=$(dirname "$(dirname "$SIG_BIN")")

          # Keep the release compiler, std and build runner together; overlay
          # only the reviewed process URL fix from Sig master (PR #9).
          for source in os.sig process.sig; do
            curl -fsSL "https://raw.githubusercontent.com/SB0LTD/sig/$SIG_RUNTIME_REF/lib/sig/$source" \
              -o "$SIG_PREFIX/lib/sig/$source"
          done
          test -f "$SIG_PREFIX/lib/std/std.sig"
          echo "SIG=$SIG_BIN" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$SIG_PREFIX/lib" >> "$GITHUB_ENV"
          "$SIG_BIN" version

      - name: Test ZPM library and transport graph with Sig
        run: |
          "$SIG" build test \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-root-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going
          "$SIG" build test-integration test-server-initial \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-network-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going

      - name: Check generated SB0 contract fixture
        run: |
          python3 tools/generate_sb0_contract.py --check \
            tools/testdata/sample_contract.json \
            tools/testdata/sample_contract.sig

      - name: Test and build the ZPM CLI with Sig
        working-directory: cli
        run: |
          "$SIG" build test \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-cli-test-cache \
            --global-cache-dir /tmp/zpm-global-cache \
            --keep-going
          "$SIG" build zpm \
            --Sig-lib-dir "$SIG_LIB_DIR" \
            --cache-dir /tmp/zpm-cli-build-cache \
            --global-cache-dir /tmp/zpm-global-cache
          file sig-out/bin/zpm
          sig-out/bin/zpm --version

      - name: Verify real CLI argument forwarding and child failure
        run: |
          python3 tests/test_cli_forwarding.py --sig "$SIG" --zpm cli/sig-out/bin/zpm
