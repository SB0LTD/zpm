name: PostgreSQL catalog char qualification

on:
  push:
    branches: [ci/pg-catalog-char-20261118]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02660dde23a706284465ddd9243970ed81a78192
      - name: Install checksum-verified Sig 0.6.5
        shell: bash
        run: |
          tag=sig-0.6.5-zig0.17.0.3c72687
          asset="$tag-x86_64-linux.tar.xz"
          curl -fsSL --retry 3 "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" -o "$RUNNER_TEMP/$asset"
          echo "179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a  $RUNNER_TEMP/$asset" | sha256sum -c
          mkdir "$RUNNER_TEMP/sdk"
          tar -xf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sdk"
          compiler=$(find "$RUNNER_TEMP/sdk" -type f -name sig | head -n 1)
          standard=$(find "$RUNNER_TEMP/sdk" -type f -path '*/lib/std/std.sig' | head -n 1)
          test -x "$compiler"
          test -f "$standard"
          printf 'SIG=%s\nSIG_LIB_DIR=%s\n' "$compiler" "${standard%/std/std.sig}" >> "$GITHUB_ENV"
      - name: Run change record and ordinary DDL contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir evidence
          git rev-parse HEAD | tee evidence/source.log
          "$SIG" version | tee evidence/sig-version.log
          "$SIG" build run-contract-sql-ddl-core run-contract-postgres run-contract-sql-change-log run-contract-sql-schema-objects run-contract-sql-catalog \
            --Sig-lib-dir "$SIG_LIB_DIR" -Doptimize=ReleaseSafe -j1 2>&1 | tee evidence/contracts.log
      - name: Verify exact projected types and codes on stock PostgreSQL 18.3
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name catalog-char-postgres -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
          trap 'docker rm -f catalog-char-postgres >/dev/null' EXIT
          for i in $(seq 1 90); do
            if docker exec catalog-char-postgres pg_isready -h localhost -U postgres; then break; fi
            sleep 1
          done
          docker exec -i catalog-char-postgres psql -h localhost -U postgres -XAtq -v ON_ERROR_STOP=1 > evidence/native-catalog-char.txt <<'SQL'
          SHOW server_version;
          CREATE TABLE attr_kinds (n integer, i integer GENERATED BY DEFAULT AS IDENTITY, g integer GENERATED ALWAYS AS (n + 1) STORED);
          SELECT attname, pg_typeof(attalign)::oid, pg_typeof(attidentity)::oid, pg_typeof(attgenerated)::oid, attidentity::integer, attgenerated::integer FROM pg_attribute WHERE attrelid = 'attr_kinds'::regclass AND attalign = 'i' AND attnum > 0 ORDER BY attnum;
          CREATE SCHEMA dep;
          CREATE TABLE dep.p (id INT NOT NULL);
          CREATE TABLE dep.c (id INT, parent_id INT);
          INSERT INTO dep.p VALUES (2);
          ALTER TABLE dep.p ADD CONSTRAINT p_pkey PRIMARY KEY (id);
          ALTER TABLE dep.c ADD CONSTRAINT fk FOREIGN KEY (parent_id) REFERENCES dep.p(id);
          SELECT pg_typeof(deptype)::oid, deptype, COUNT(*) FROM pg_depend d JOIN pg_constraint c ON c.oid = d.objid WHERE d.classid = 2606 AND d.refclassid = 1259 AND c.conname = 'fk' GROUP BY deptype ORDER BY deptype;
          SQL
          tail -n +2 evidence/native-catalog-char.txt > "$RUNNER_TEMP/catalog-char-actual"
          cat > "$RUNNER_TEMP/catalog-char-expected" <<'EXPECTED'
          n|18|18|18|0|0
          i|18|18|18|100|0
          g|18|18|18|0|115
          18|a|1
          18|n|2
          EXPECTED
          diff -u "$RUNNER_TEMP/catalog-char-expected" "$RUNNER_TEMP/catalog-char-actual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-internal-char
          path: evidence/
