name: PostgreSQL routine body validation setting

on:
  push:
    branches: [ci/pg-check-function-bodies-20261118]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZPM_SOURCE_REVISION: dac0e8b200b12a73c9f2e25d3da37e6f0e737a7d
  ZPM_SOURCE_SHA256: ca3bd45cee1db53d9296bc004eb0933570f343c964ed9b1bc136d2838d1f2aaf
  SIG_TAG: sig-0.6.5-zig0.17.0.3c72687

jobs:
  contracts:
    name: Quoted routines and Store settings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: sig-0.6.5-zig0.17.0.3c72687-x86_64-linux.tar.xz
            sha256: 179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a
    env:
      SIG_ASSET: ${{ matrix.asset }}
      SIG_SHA256: ${{ matrix.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ZPM_SOURCE_REVISION }}
      - name: Verify source and install Sig
        run: |
          if ((git rev-parse HEAD) -ne $env:ZPM_SOURCE_REVISION) { throw 'Unexpected source revision' }
          $null = New-Item -ItemType Directory -Force evidence,sig-out
          $env:ZPM_SOURCE_REVISION > evidence/zpm-revision.txt
          $toolchain = (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'sig-toolchain')).FullName
          $archive = Join-Path $env:RUNNER_TEMP $env:SIG_ASSET
          Invoke-WebRequest -Uri "https://github.com/SB0LTD/sig/releases/download/$env:SIG_TAG/$env:SIG_ASSET" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SIG_SHA256) { throw 'Sig archive checksum differs from its pin' }
          $actual > evidence/sig-archive-sha256.txt
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archive -DestinationPath $toolchain
            $name = 'sig.exe'
          } else {
            tar -xf $archive -C $toolchain
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $name = 'sig'
          }
          $compiler = @(Get-ChildItem -Path $toolchain -Recurse -File |
            Where-Object { $_.Name -ceq $name -and $_.Directory.Name -ceq 'bin' })
          if ($compiler.Length -ne 1) { throw 'Expected one native Sig compiler' }
          $lib = Join-Path $compiler[0].Directory.Parent.FullName 'lib'
          if (-not (Test-Path -LiteralPath (Join-Path $lib 'std/std.sig'))) { throw 'Missing Sig standard library' }
          "SIG=$($compiler[0].FullName)" >> $env:GITHUB_ENV
          "SIG_LIB_DIR=$lib" >> $env:GITHUB_ENV
          & $compiler[0].FullName version | Tee-Object evidence/sig-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact source and execute routine and Store assertions
        run: |
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'zpm.tar.gz'
          Invoke-WebRequest -Uri "https://github.com/SB0LTD/zpm/archive/$env:ZPM_SOURCE_REVISION.tar.gz" -OutFile $sourceArchive
          if ((Get-FileHash $sourceArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ZPM_SOURCE_SHA256) {
            throw 'ZPM archive checksum differs from its pin'
          }
          foreach ($suite in @('sql_routines', 'db_store')) {
            $binary = Join-Path $env:RUNNER_TEMP $suite
            $imports = @('--dep', 'sql')
            $modules = @('-Msql=src/core/sql.sig')
            if ($suite -eq 'db_store') {
              $imports += @('--dep', 'db_store')
              $modules += '-Mdb_store=src/db/store.sig'
            }
            & $env:SIG build-exe --Sig-lib-dir $env:SIG_LIB_DIR -OReleaseSafe @imports "-Mroot=tests/test_$suite.sig" @modules "-femit-bin=$binary"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $binary 2>&1 | Tee-Object "evidence/$suite.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Select-String -Path "evidence/$suite.txt" -Pattern 'assertions')) { throw 'Native assertions did not execute' }
            (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() > "evidence/$suite.sha256"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-check-function-bodies-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
