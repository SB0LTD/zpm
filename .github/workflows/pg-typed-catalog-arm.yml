name: PostgreSQL typed catalog ARM qualification
on:
  push:
    branches: [ci/pg-typed-catalog-arm-20261118]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - leaf: attribute
            revision: b8063e8668e899b8ff94526f998dc78d457ae82e
            commands: run-contract-sql-ddl-core run-contract-sql-catalog-security
          - leaf: internal-char
            revision: dc594aaab859d87352bf5e23fc2d0c9efc969537
            commands: run-contract-sql-ddl-core run-contract-postgres run-contract-sql-change-log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - name: Install checksum-verified Sig 0.6.5 for AArch64
        shell: bash
        run: |
          tag=sig-0.6.5-zig0.17.0.3c72687
          asset="$tag-aarch64-linux.tar.xz"
          curl -fsSL --retry 3 "https://github.com/SB0LTD/sig/releases/download/$tag/$asset" -o "$RUNNER_TEMP/$asset"
          echo "ef890f870f3215e60d25588742b74fa9d2808addbc0112b7c37818a73dfb0643  $RUNNER_TEMP/$asset" | sha256sum -c
          mkdir "$RUNNER_TEMP/sdk"
          tar -xf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sdk"
          compiler=$(find "$RUNNER_TEMP/sdk" -type f -name sig | head -n 1)
          standard=$(find "$RUNNER_TEMP/sdk" -type f -path '*/lib/std/std.sig' | head -n 1)
          test -x "$compiler"
          test -f "$standard"
          printf 'SIG=%s\nSIG_LIB_DIR=%s\n' "$compiler" "${standard%/std/std.sig}" >> "$GITHUB_ENV"
      - name: Run allocator-free contracts
        shell: bash
        run: |
          mkdir evidence
          git rev-parse HEAD | tee evidence/source.log
          "$SIG" version | tee evidence/sig-version.log
          "$SIG" build ${{ matrix.commands }} --Sig-lib-dir "$SIG_LIB_DIR" -Doptimize=ReleaseSafe -j1 2>&1 | tee evidence/contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-catalog-arm-${{ matrix.leaf }}
          path: evidence/
