name: Stable database writer lock contracts

on:
  push:
    branches: [ci/wal-stable-writer-lock-20261118]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZPM_SOURCE_REVISION: d4bf72de5f496acaa6b854fe8004c9a18feff6c8
  SIG_TAG: sig-0.6.5-zig0.17.0.3c72687

jobs:
  contracts:
    name: Writer lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: sig-0.6.5-zig0.17.0.3c72687-x86_64-linux.tar.xz
            sha256: 179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a
          - os: macos-latest
            asset: sig-0.6.5-zig0.17.0.3c72687-aarch64-macos.tar.xz
            sha256: a936b163c87b471b603caa78aa84d4542c28b9ce3885f502d6901d68a3d716ae
    env:
      SIG_ASSET: ${{ matrix.asset }}
      SIG_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ZPM_SOURCE_REVISION }}
      - name: Verify source and install Sig
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZPM_SOURCE_REVISION"
          mkdir -p evidence sig-out "$RUNNER_TEMP/sig-toolchain"
          archive="$RUNNER_TEMP/$SIG_ASSET"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/sig/releases/download/$SIG_TAG/$SIG_ASSET" --output "$archive"
          printf '%s  %s\n' "$SIG_SHA256" "$archive" | shasum -a 256 -c
          tar -xf "$archive" -C "$RUNNER_TEMP/sig-toolchain"
          compiler=$(find "$RUNNER_TEMP/sig-toolchain" -type f -name sig -print)
          test -x "$compiler"
          lib="$(dirname "$(dirname "$compiler")")/lib"
          test -f "$lib/std/std.sig"
          echo "SIG=$compiler" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$lib" >> "$GITHUB_ENV"
          "$compiler" version | tee evidence/sig-version.txt
          printf '%s\n' "$ZPM_SOURCE_REVISION" > evidence/zpm-revision.txt
          printf '%s  %s\n' "$SIG_SHA256" "$SIG_ASSET" > evidence/sig-archive-sha256.txt
      - name: Compile and run the ReleaseSafe database-file contract
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/contract-db-file"
          flags=(-OReleaseSafe)
          if [[ "$RUNNER_OS" == macOS ]]; then flags+=(-lc); fi
          "$SIG" build-exe --Sig-lib-dir "$SIG_LIB_DIR" "${flags[@]}" --dep durable_log --dep db_file -Mroot=tests/test_db_file.sig -Mdurable_log=src/db/durable_log.sig -Mdb_file=src/platform/db_file.sig "-femit-bin=$binary" 2>&1 | tee evidence/db-file-build.txt
          "$binary" 2>&1 | tee evidence/db-file-result.txt
          grep -F '"suite":"db_file","pass":true' evidence/db-file-result.txt
          shasum -a 256 "$binary" > evidence/contract-binary-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-stable-writer-lock-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
