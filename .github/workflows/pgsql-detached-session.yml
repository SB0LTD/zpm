name: PostgreSQL detached session qualification

on:
  push:
    branches: [ci/pgsql-detached-notify-20261117]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZPM_SOURCE_REVISION: bbbef3aad662c5f371bda0c9f34d1a3a7fc6459c
  SIG_TAG: sig-0.6.5-zig0.17.0.3c72687
  SIG_ASSET: sig-0.6.5-zig0.17.0.3c72687-x86_64-linux.tar.xz
  SIG_SHA256: 179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a

jobs:
  contracts:
    name: SQL ${{ matrix.group }} contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: transaction
            target: run-contract-sql-tx-session
          - group: parallel-read
            target: run-contract-parallel-read
          - group: catalog
            target: run-contract-sql-catalog-security
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ZPM_SOURCE_REVISION }}
      - name: Verify source and install Sig
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZPM_SOURCE_REVISION"
          mkdir -p evidence "$RUNNER_TEMP/sig-toolchain"
          archive="$RUNNER_TEMP/$SIG_ASSET"
          curl --fail --location --retry 3 "https://github.com/SB0LTD/sig/releases/download/$SIG_TAG/$SIG_ASSET" --output "$archive"
          printf '%s  %s\n' "$SIG_SHA256" "$archive" | sha256sum --check --strict -
          tar -xf "$archive" -C "$RUNNER_TEMP/sig-toolchain"
          compiler=$(find "$RUNNER_TEMP/sig-toolchain" -type f -name sig -perm -u+x -print -quit)
          test -n "$compiler"
          lib="$(dirname "$(dirname "$compiler")")/lib"
          test -f "$lib/std/std.sig"
          echo "SIG=$compiler" >> "$GITHUB_ENV"
          echo "SIG_LIB_DIR=$lib" >> "$GITHUB_ENV"
          "$compiler" version | tee evidence/sig-version.txt
          printf '%s\n' "$ZPM_SOURCE_REVISION" > evidence/zpm-revision.txt
          printf '%s  %s\n' "$SIG_SHA256" "$SIG_ASSET" > evidence/sig-archive-sha256.txt
      - name: Compile and execute ReleaseSafe assertions
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          "$SIG" build "$TARGET" -Doptimize=ReleaseSafe -j1 --Sig-lib-dir "$SIG_LIB_DIR" 2>&1 | tee evidence/contract.txt
          grep 'PASS' evidence/contract.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detached-session-${{ matrix.group }}
          path: evidence/
          if-no-files-found: error
