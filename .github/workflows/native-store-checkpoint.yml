name: Native checkpoint manifest publication

on:
  push:
    branches: [ci/native-checkpoint-manifest-20261118]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZPM_SOURCE_REVISION: 539da73f9815bcc14566f46a4911753092db795a
  SIG_TAG: sig-0.6.5-zig0.17.0.3c72687

jobs:
  contracts:
    name: Native checkpoint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: sig-0.6.5-zig0.17.0.3c72687-x86_64-linux.tar.xz
            sha256: 179094228e2e6b0db3a5a1e01a8a57e8e91db6aa3b5ca80094ca22d870cc373a
          - os: macos-latest
            asset: sig-0.6.5-zig0.17.0.3c72687-aarch64-macos.tar.xz
            sha256: a936b163c87b471b603caa78aa84d4542c28b9ce3885f502d6901d68a3d716ae
          - os: windows-latest
            asset: sig-0.6.5-zig0.17.0.3c72687-x86_64-windows.zip
            sha256: 291a3225ff33c32e8c479471c44be6db0d811d6023d759c64e0a7d5bf810576c
    env:
      SIG_ASSET: ${{ matrix.asset }}
      SIG_SHA256: ${{ matrix.sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ZPM_SOURCE_REVISION }}
      - name: Verify source and install Sig
        run: |
          if ((git rev-parse HEAD) -ne $env:ZPM_SOURCE_REVISION) { throw 'Unexpected source revision' }
          $null = New-Item -ItemType Directory -Force evidence,sig-out
          $env:ZPM_SOURCE_REVISION > evidence/zpm-revision.txt
          $toolchain = (New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'sig-toolchain')).FullName
          $archive = Join-Path $env:RUNNER_TEMP $env:SIG_ASSET
          Invoke-WebRequest -Uri "https://github.com/SB0LTD/sig/releases/download/$env:SIG_TAG/$env:SIG_ASSET" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SIG_SHA256) { throw 'Sig archive checksum differs from its pin' }
          $actual > evidence/sig-archive-sha256.txt
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archive -DestinationPath $toolchain
            $name = 'sig.exe'
          } else {
            tar -xf $archive -C $toolchain
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $name = 'sig'
          }
          $compiler = @(Get-ChildItem -Path $toolchain -Recurse -File |
            Where-Object { $_.Name -ceq $name -and $_.Directory.Name -ceq 'bin' })
          if ($compiler.Length -ne 1) { throw 'Expected one native Sig compiler' }
          $lib = Join-Path $compiler[0].Directory.Parent.FullName 'lib'
          if (-not (Test-Path -LiteralPath (Join-Path $lib 'std/std.sig'))) { throw 'Missing Sig standard library' }
          "SIG=$($compiler[0].FullName)" >> $env:GITHUB_ENV
          "SIG_LIB_DIR=$lib" >> $env:GITHUB_ENV
          & $compiler[0].FullName version | Tee-Object evidence/sig-version.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify atomic manifest selection and recover the WAL suffix
        run: |
          $name = if ($env:RUNNER_OS -eq 'Windows') { 'native-store-checkpoint.exe' } else { 'native-store-checkpoint' }
          $binary = Join-Path $env:RUNNER_TEMP $name
          $flags = @('-OReleaseSafe')
          if ($env:RUNNER_OS -eq 'macOS') { $flags += '-lc' }
          & $env:SIG build-exe --Sig-lib-dir $env:SIG_LIB_DIR @flags `
            --dep db_file --dep durable_log --dep snapshot_envelope --dep sql --dep db_store --dep checkpoint_manifest `
            '-Mroot=tests/test_native_store_checkpoint.sig' '-Mdb_file=src/platform/db_file.sig' `
            '-Mdurable_log=src/db/durable_log.sig' '-Msnapshot_envelope=src/db/snapshot_envelope.sig' `
            '-Msql=src/core/sql.sig' '-Mdb_store=src/db/store.sig' '-Mcheckpoint_manifest=src/db/checkpoint_manifest.sig' `
            "-femit-bin=$binary" 2>&1 | Tee-Object evidence/checkpoint-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary 2>&1 | Tee-Object evidence/checkpoint-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content evidence/checkpoint-result.json -Raw | ConvertFrom-Json
          if ($report.suite -ne 'native_store_checkpoint' -or $report.pass -ne $true -or $report.assertions -ne 68) {
            throw 'Native assertions did not execute'
          }
          (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() > evidence/contract-binary-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-checkpoint-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
